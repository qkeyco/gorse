[package]
name = "hedgehog-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Gorse CLI — cross-platform credential exfiltration protection"

[[bin]]
name = "gorse"
path = "src/main.rs"

[dependencies]
hedgehog_taint = { workspace = true }
hedgehog-packs = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# Already locked transitively by Ed25519; binds delivery receipts to their route.
sha2 = "0.10"
chrono = "0.4"
ureq = "2"
hostname = "0.4"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
windows-daemon = []
linux-daemon = []
