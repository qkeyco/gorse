# Register of credential locations the Fast Scan knows about.
#
# This file is the source of truth for *why* a location is on the list. The
# code decides *how* it is checked; a unit test (src/exposure/register.rs)
# fails when the two drift apart. The procedure for keeping this file current
# is in docs/CREDENTIAL_LOCATIONS.md.
#
# Each location says how it is covered:
#   watched    = ["all"] or a list of platforms. On the reported watch list:
#                hedgehog status / scan --all list it and the Fast Scan hands
#                it to TruffleHog. Lives in taint_engine/src/secrets.rs.
#   guarded    = platforms where only the agent guard knows the path (reads
#                of it taint the process) but nothing reports or scans it:
#                filename rules in taint_engine/src/secrets.rs, and the
#                system paths in hedgehog-linux/src/secrets.rs.
#   discovered = true when a Fast Scan adapter in exposure/discover.rs opens
#                and parses it.
#   status     = "covered" (at least one of the above), "gap" (cited by a
#                source, not checked yet) or "excluded" (note says why).
#
# Paths use ~ for the home directory and %USERPROFILE% / %APPDATA% /
# %LOCALAPPDATA% on Windows. `code` is the literal the discovery adapter uses
# when it differs from the path (for computed or per-project paths).

[meta]
reviewed = "2026-11-02"
procedure = "docs/CREDENTIAL_LOCATIONS.md"

