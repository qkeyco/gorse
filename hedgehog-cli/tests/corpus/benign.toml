# ── Interpreters and task runners (scan-before-execute must stay quiet) ──
# None of these files exist in the corpus workdir, and a missing or
# unreadable script is never a block. The cases guard the fast path: the
# hook must not refuse a plain interpreter invocation it cannot inspect.
[[case]]
id = "benign-script-001"
tool = "Bash"
command = "bash scripts/build.sh"
expect = "allow"
why = "running a build script that is not present is allowed"
os = "any"

[[case]]
id = "benign-script-002"
tool = "Bash"
command = "./gradlew test"
expect = "allow"
why = "gradle wrapper, a script in the project"
os = "any"

[[case]]
id = "benign-script-003"
tool = "Bash"
command = "python3 manage.py runserver"
expect = "allow"
why = "Django development server"
os = "any"

[[case]]
id = "benign-script-004"
