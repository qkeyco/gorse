# benign.toml — ordinary developer activity that MUST stay ALLOWED.
# Every case here is a false-positive guard: a block is a regression.
# These define the "do no harm" half of the specification. Keep this file
# large and boring on purpose.

# ── Version control ────────────────────────────────────────────────────
[[case]]
id = "benign-git-001"
tool = "Bash"
command = "git status"
expect = "allow"
why = "status is read-only; from 08-negative-tests.sh"
os = "any"

[[case]]
id = "benign-git-002"
tool = "Bash"
command = "git push origin feature-branch"
expect = "allow"
why = "pushing a feature branch is normal; from 08-negative-tests.sh"

[[case]]
id = "benign-git-003"
tool = "Bash"
command = "git commit -m 'fix: handle empty input'"
expect = "allow"
why = "committing is routine"

[[case]]
id = "benign-git-004"
tool = "Bash"
command = "git pull --rebase origin master"
expect = "allow"
why = "pull/rebase is routine"

[[case]]
id = "benign-git-005"
tool = "Bash"
command = "git checkout -b feature/new-ui"
expect = "allow"
why = "branching is routine"

[[case]]
id = "benign-git-006"
tool = "Bash"
command = "git diff HEAD~1"
expect = "allow"
why = "diff is read-only"

[[case]]
id = "benign-git-007"
tool = "Bash"
command = "git log --oneline -20"
expect = "allow"
why = "log is read-only"

[[case]]
id = "benign-git-008"
tool = "Bash"
command = "git stash"
expect = "allow"
why = "plain stash (no clear/drop-all) is safe"

[[case]]
id = "benign-git-009"
tool = "Bash"
command = "git remote -v"
expect = "allow"
why = "listing remotes is read-only"

[[case]]
id = "benign-git-010"
tool = "Bash"
command = "git clean -n"
expect = "allow"
why = "clean dry-run (-n) only previews"

