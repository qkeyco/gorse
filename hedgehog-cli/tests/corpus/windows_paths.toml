why = "Select-String prints every line of the AWS credentials file; the Windows grep is a reader; category (b)"
os = "any"

[[case]]
id = "win-064"
tool = "Bash"
command = "findstr /i key C:\\Users\\jane\\.aws\\credentials"
expect = "block"
why = "findstr prints the matching secret lines of the AWS credentials file; category (b)"
os = "any"

# ── Windows benign (must stay allowed) ─────────────────────────────────
[[case]]
id = "win-allow-001"
tool = "Bash"
command = "Get-Content package.json"
