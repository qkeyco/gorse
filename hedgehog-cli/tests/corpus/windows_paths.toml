[[case]]
id = "win-allow-010"
tool = "Write"
file_path = "C:\\Users\\jane\\AppData\\Roaming\\Code\\User\\settings.json"
content = "{}"
expect = "allow"
why = "writing another app's settings under Roaming is fine"
os = "any"

[[case]]
id = "win-allow-011"
tool = "Read"
file_path = "C:\\Users\\jane\\AppData\\Local\\hedgehog\\cache.bin"
expect = "allow"
why = "AppData\\Local is not the state directory (that is Roaming)"
os = "any"

[[case]]
id = "win-allow-012"
tool = "Bash"
command = "Select-String TODO src\\*.rs"
expect = "allow"
why = "grepping source files with Select-String is fine"
os = "any"

[[case]]
id = "win-allow-013"
tool = "Bash"
command = "findstr /s TODO *.ts"
expect = "allow"
why = "grepping source files with findstr is fine"
os = "any"
