# Gorse Security Pack: Secret Reads
# Blocks reading credentials INTO the agent's conversation.
#
# The secrets_exfiltration pack catches secrets leaving the machine over the
# network. This pack catches the step before that: the agent printing a
# credential file or a secret environment variable, which puts the secret in
# the transcript that is sent to the model provider.
#
# Known credential locations mirror the SecretDetector list in
# taint_engine/src/secrets.rs (`SecretDetector::add_user_home`). That list is
# the source of truth; keep this pack in step with it when a location is added
# there. The two cannot share code: the detector matches resolved filesystem
# paths, while these rules match the text of a shell command before it runs.
#
# Conventions used in the patterns below:
#   * A credential path is matched by its distinctive tail (".aws/credentials"),
#     so "~", "$HOME", "${HOME}", "/Users/<name>/", "/home/<name>/" and Windows
#     "C:\Users\<name>\" spellings are all covered. "[/\\]" accepts either
#     path separator.
#   * Reader commands must be followed by a boundary character before the
#     path, so "cat app.env" and "catalog .env" are not reads of ".env".
#   * For cp/mv/rsync/scp only the FIRST non-flag argument (the source) is
#     checked, so "cp .env.example .env" is allowed and "cp .env backup" is not.
#     A quoted "$HOME" or "${HOME}" prefix inside that argument is accepted.
#   * ".env.example", ".env.sample" and ".env.template" are allowed: ".env" must
#     be followed by a terminator or one of the listed real-deployment suffixes.
#   * "~/.ssh/id_*.pub" is allowed: the key name must be followed by a
#     terminator, so ".pub" never matches.
#   * Gorse keeps its own state in "~/.hedgehog" on unix and in
#     "%APPDATA%\hedgehog" on Windows (config_dir() in hedgehog-cli), so the
#     rules that name ".hedgehog/" also accept, case-insensitively,
#     "AppData\Roaming\hedgehog", "%APPDATA%\hedgehog",
#     "$env:APPDATA\hedgehog", "${env:APPDATA}\hedgehog" and
#     "Roaming\hedgehog" with either separator. The bare word "hedgehog"
#     never matches on its own.
#
# Regex dialect: the Rust `regex` crate (no lookaround, no backreferences).

[pack]
name = "secret_reads"
version = "1.0.0"
description = "Blocks reading credential files and secret environment variables into the agent's context"
author = "Gorse"
category = "secrets"

# ─── Bash: credential files ─────────────────────────────────────────────────
#
# Shared reader prefix (repeated verbatim in each rule below):
#   readers:  cat less more head tail bat base64 xxd hexdump od strings nl tac
#             rev tee dd source sed awk grep rg cut tr sort uniq jq yq pbcopy
#             xclip zip tar gzip python node ruby perl php deno bun type
#             Get-Content certutil openssl gpg cmp diff paste column nc socat
#             curl wget, "." (source), and the file-open calls of interpreter
#             one-liners (open( readFileSync( File.read( ...), which the engine
#             also checks inside the quoted code of python -c / node -e.
#             Windows/PowerShell: type, Get-Content and its aliases gc and cat,
#             more, and the grep equivalents findstr, Select-String and sls
#             (a match line is a read of the matching secret).
#   copiers:  cp mv rsync scp install (first non-flag argument only)

[[rules]]
name = "Read Gorse's own state (approvals, logs, history, license)"
pattern = '''(\b(cat|less|more|head|tail|bat|batcat|base64|xxd|hexdump|hd|od|strings|nl|tac|rev|tee|dd|source|sed|awk|grep|egrep|fgrep|rg|ag|ack|cut|tr|sort|uniq|jq|yq|pbcopy|xclip|xsel|clip|zip|tar|gzip|bzip2|xz|7z|python[0-9.]*|node|ruby|perl|php|deno|bun|type|Get-Content|gc|findstr|Select-String|sls|certutil|openssl|gpg|cmp|diff|paste|column|fold|iconv|split|nc|ncat|socat|curl|wget|sqlite3?|open|fopen|readFileSync|readFile|File\.read|File\.open|IO\.read|file_get_contents|read_text|read_bytes)([\s(][^|;&\n]*)?[\s/\\'"=(]|(^|[;&|(]\s*)\.(\s[^|;&\n]*)?[\s/\\'"=(]|\b(cp|mv|rsync|scp|install)(\s+-\S+)*\s+["']?((["']\$\{?HOME\}?["']|[^\s"'])*[/\\])?)(\.hedgehog|(?i:(appdata[/\\]+roaming|%appdata%|\$\{?env:appdata\}?|\broaming)[/\\]+hedgehog))[/\\](approvals\.json|bypass_codes\.json|exceptions\.log|history\.db|license\.key|logs([/\\]|[\s'"`;|&)<>]|$))'''
severity = "block"
message = "BLOCKED: This would read Gorse's own pending approvals, audit log, history or license into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Use 'gorse history' or 'gorse status' for a summary that omits approvals and secrets."

[[rules]]
name = "Read cloud or service credential file"
pattern = '''(\b(cat|less|more|head|tail|bat|batcat|base64|xxd|hexdump|hd|od|strings|nl|tac|rev|tee|dd|source|sed|awk|grep|egrep|fgrep|rg|ag|ack|cut|tr|sort|uniq|jq|yq|pbcopy|xclip|xsel|clip|zip|tar|gzip|bzip2|xz|7z|python[0-9.]*|node|ruby|perl|php|deno|bun|type|Get-Content|gc|findstr|Select-String|sls|certutil|openssl|gpg|cmp|diff|paste|column|fold|iconv|split|nc|ncat|socat|curl|wget|open|fopen|readFileSync|readFile|File\.read|File\.open|IO\.read|file_get_contents|read_text|read_bytes)([\s(][^|;&\n]*)?[\s/\\'"=(]|(^|[;&|(]\s*)\.(\s[^|;&\n]*)?[\s/\\'"=(]|\b(cp|mv|rsync|scp|install)(\s+-\S+)*\s+["']?((["']\$\{?HOME\}?["']|[^\s"'])*[/\\])?)(\.aws[/\\](credentials|config)|\.kube[/\\]config|\.config[/\\]gcloud[/\\][^\s|;&'"]*credentials|\.azure[/\\][^\s|;&'"]*[tT]oken|\.docker[/\\]config\.json|\.config[/\\]gh[/\\]hosts\.yml|\.config[/\\]stripe[/\\]config\.toml|\.vercel[/\\]auth\.json|\.config[/\\]supabase[/\\]access-token|\.terraform\.d[/\\]credentials\.tfrc\.json|\.git-credentials|\.gem[/\\]credentials|\.cargo[/\\]credentials|\.m2[/\\]settings\.xml|\.boto\b|\.s3cfg\b|\.config[/\\]hub\b)'''
severity = "block"
message = "BLOCKED: This would read cloud or service credentials (AWS, Kubernetes, Google Cloud, Azure, Docker, GitHub, Stripe or similar) into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Use the provider's CLI to check identity without printing secrets (for example 'aws sts get-caller-identity', 'gh auth status', 'kubectl config current-context')."

[[rules]]
name = "Read SSH, GPG or other private key"
pattern = '''(\b(cat|less|more|head|tail|bat|batcat|base64|xxd|hexdump|hd|od|strings|nl|tac|rev|tee|dd|source|sed|awk|grep|egrep|fgrep|rg|ag|ack|cut|tr|sort|uniq|jq|yq|pbcopy|xclip|xsel|clip|zip|tar|gzip|bzip2|xz|7z|python[0-9.]*|node|ruby|perl|php|deno|bun|type|Get-Content|gc|findstr|Select-String|sls|certutil|openssl|gpg|cmp|diff|paste|column|fold|iconv|split|nc|ncat|socat|curl|wget|open|fopen|readFileSync|readFile|File\.read|File\.open|IO\.read|file_get_contents|read_text|read_bytes)([\s(][^|;&\n]*)?[\s/\\'"=(]|(^|[;&|(]\s*)\.(\s[^|;&\n]*)?[\s/\\'"=(]|\b(cp|mv|rsync|scp|install)(\s+-\S+)*\s+["']?((["']\$\{?HOME\}?["']|[^\s"'])*[/\\])?)(\.ssh[/\\]id_[A-Za-z0-9_-]+([\s'"`;|&)<>]|$)|id_(rsa|dsa|ecdsa|ed25519)(_sk)?([\s'"`;|&)<>]|$)|[^\s|;&'"=(]*\.(pem|key|p12|pfx|keystore|jks|ppk)([\s'"`;|&)<>]|$)|\.gnupg[/\\])'''
severity = "block"
message = "BLOCKED: This would read a private key (SSH, GPG, TLS or a keystore) into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Public halves are fine to print: 'cat ~/.ssh/id_ed25519.pub' or 'ssh-keygen -y -f <key>'. Use 'ssh-add -l' or 'gpg --list-keys' to list keys."

[[rules]]
name = "Read package registry, database or network credential file"
pattern = '''(\b(cat|less|more|head|tail|bat|batcat|base64|xxd|hexdump|hd|od|strings|nl|tac|rev|tee|dd|source|sed|awk|grep|egrep|fgrep|rg|ag|ack|cut|tr|sort|uniq|jq|yq|pbcopy|xclip|xsel|clip|zip|tar|gzip|bzip2|xz|7z|python[0-9.]*|node|ruby|perl|php|deno|bun|type|Get-Content|gc|findstr|Select-String|sls|certutil|openssl|gpg|cmp|diff|paste|column|fold|iconv|split|nc|ncat|socat|curl|wget|open|fopen|readFileSync|readFile|File\.read|File\.open|IO\.read|file_get_contents|read_text|read_bytes)([\s(][^|;&\n]*)?[\s/\\'"=(]|(^|[;&|(]\s*)\.(\s[^|;&\n]*)?[\s/\\'"=(]|\b(cp|mv|rsync|scp|install)(\s+-\S+)*\s+["']?((["']\$\{?HOME\}?["']|[^\s"'])*[/\\])?)(\.npmrc|\.pypirc|\.netrc|_netrc|\.yarnrc\.yml|\.pgpass|\.my\.cnf|\.psql_history|\.mysql_history)([\s'"`;|&)<>]|$)'''
severity = "block"
message = "BLOCKED: This would read a registry, database or network credential file (.npmrc, .pypirc, .netrc, .pgpass or similar) into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Check login state without printing tokens: 'npm whoami', 'pip config list' or 'psql -c \"select current_user\"'."

[[rules]]
name = "Read .env file"
pattern = '''(\b(cat|less|more|head|tail|bat|batcat|base64|xxd|hexdump|hd|od|strings|nl|tac|rev|tee|dd|source|sed|awk|grep|egrep|fgrep|rg|ag|ack|cut|tr|sort|uniq|jq|yq|pbcopy|xclip|xsel|clip|zip|tar|gzip|bzip2|xz|7z|python[0-9.]*|node|ruby|perl|php|deno|bun|type|Get-Content|gc|findstr|Select-String|sls|certutil|openssl|gpg|cmp|diff|paste|column|fold|iconv|split|nc|ncat|socat|curl|wget|open|fopen|readFileSync|readFile|File\.read|File\.open|IO\.read|file_get_contents|read_text|read_bytes)([\s(][^|;&\n]*)?[\s/\\'"=(]|(^|[;&|(]\s*)\.(\s[^|;&\n]*)?[\s/\\'"=(]|\b(cp|mv|rsync|scp|install)(\s+-\S+)*\s+["']?((["']\$\{?HOME\}?["']|[^\s"'])*[/\\])?)(\.env(\.(local|production|prod|staging|stage|development|dev|test|testing|secret|secrets|ci|preview|live|docker|compose|[0-9]+))?|\.envrc|\.secrets?)([\s'"`;|&)<>]|$)'''
severity = "block"
message = "BLOCKED: This would read a .env file into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "List the variable NAMES without values: 'sed -E \"s/=.*//\" .env' (allowed), or read .env.example instead."

[[rules]]
name = "Read cryptocurrency wallet or keystore"
pattern = '''(\b(cat|less|more|head|tail|bat|batcat|base64|xxd|hexdump|hd|od|strings|nl|tac|rev|tee|dd|source|sed|awk|grep|egrep|fgrep|rg|ag|ack|cut|tr|sort|uniq|jq|yq|pbcopy|xclip|xsel|clip|zip|tar|gzip|bzip2|xz|7z|python[0-9.]*|node|ruby|perl|php|deno|bun|type|Get-Content|gc|findstr|Select-String|sls|certutil|openssl|gpg|cmp|diff|paste|column|fold|iconv|split|nc|ncat|socat|curl|wget|open|fopen|readFileSync|readFile|File\.read|File\.open|IO\.read|file_get_contents|read_text|read_bytes)([\s(][^|;&\n]*)?[\s/\\'"=(]|(^|[;&|(]\s*)\.(\s[^|;&\n]*)?[\s/\\'"=(]|\b(cp|mv|rsync|scp|install)(\s+-\S+)*\s+["']?((["']\$\{?HOME\}?["']|[^\s"'])*[/\\])?)(wallet\.dat|\.config[/\\]solana[/\\]id\.json|keystore[/\\]|\.ethereum[/\\]keystore|\.bitcoin[/\\]wallet|\.electrum[/\\]wallets|UTC--[0-9]{4}-)'''
severity = "block"
message = "BLOCKED: This would read a cryptocurrency wallet or keystore into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Use the wallet CLI to show the public address only (for example 'solana address')."

[[rules]]
name = "Read macOS Keychain or Linux keyring files"
pattern = '''(\b(cat|less|more|head|tail|bat|batcat|base64|xxd|hexdump|hd|od|strings|nl|tac|rev|tee|dd|source|sed|awk|grep|egrep|fgrep|rg|ag|ack|cut|tr|sort|uniq|jq|yq|pbcopy|xclip|xsel|clip|zip|tar|gzip|bzip2|xz|7z|python[0-9.]*|node|ruby|perl|php|deno|bun|type|Get-Content|gc|findstr|Select-String|sls|certutil|openssl|gpg|cmp|diff|paste|column|fold|iconv|split|nc|ncat|socat|curl|wget|open|fopen|readFileSync|readFile|File\.read|File\.open|IO\.read|file_get_contents|read_text|read_bytes)([\s(][^|;&\n]*)?[\s/\\'"=(]|(^|[;&|(]\s*)\.(\s[^|;&\n]*)?[\s/\\'"=(]|\b(cp|mv|rsync|scp|install)(\s+-\S+)*\s+["']?((["']\$\{?HOME\}?["']|[^\s"'])*[/\\])?)(Library[/\\]Keychains[/\\]|\.local[/\\]share[/\\]keyrings[/\\]|\.gnome2[/\\]keyrings|\.config[/\\]kwalletrc|\.kde[/\\]share[/\\]apps[/\\]kwallet)'''
severity = "block"
message = "BLOCKED: This would read the system credential store (macOS Keychain or Linux keyring files) into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Use 'security list-keychains' to see which keychains exist without reading them."

[[rules]]
name = "Read credential directory contents via find -exec or xargs"
pattern = '\bfind\s[^|;&\n]*(\.ssh|\.aws|\.gnupg|\.kube|\.config[/\\]gcloud|\.azure|\.docker|\.hedgehog|(?i:(appdata[/\\]+roaming|%appdata%|\$\{?env:appdata\}?|\broaming)[/\\]+hedgehog))\b[^|;&\n]*-exec\s+(cat|head|tail|base64|xxd|od|strings|less|more|cp|tee|grep)\b|(\.ssh|\.aws|\.gnupg|\.kube|\.config[/\\]gcloud|\.azure|\.docker|\.hedgehog|(?i:(appdata[/\\]+roaming|%appdata%|\$\{?env:appdata\}?|\broaming)[/\\]+hedgehog))\b[^|\n]*\|\s*(xargs\s+(-\S+\s+)*(cat|head|tail|base64|xxd|od|strings|less|more|grep|cp)|Get-Content|gc|(ForEach-Object|%)\s*\{\s*(Get-Content|gc|cat|type))\b'
severity = "block"
message = "BLOCKED: This would read the files in a credential directory (SSH, AWS, GPG, Kubernetes or similar) into the agent's conversation, which is sent to the model provider. Reference the files by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "List the directory without reading the files: 'ls -la ~/.ssh'."

# ─── Bash: environment variables ────────────────────────────────────────────

[[rules]]
name = "Dump all environment variables (env/printenv with no filter)"
pattern = '(^|[;&|(`]\s*|\b(sudo|xargs|exec|time|nohup|command|builtin)\s+)(env|printenv)(\s+(-0|--null))?\s*(\|\s*(sort|cat|head|tail|less|more|tee|uniq|column|base64|xxd|od|hexdump|rev|tac|nl|bat|pbcopy|xclip|xsel|clip|gzip|xz|zip|tar)\b|[;&)`>]|$)'
severity = "block"
message = "BLOCKED: This would read every environment variable, including API keys and tokens, into the agent's conversation, which is sent to the model provider. Check a single, non-secret variable by name instead (for example 'printenv PATH'), or ask the user to approve it with `gorse allow` if you really need the full list."
alternative = "Print one non-secret variable: 'printenv PATH', or list names only: 'env | cut -d= -f1'."

[[rules]]
name = "Dump all shell variables (set/export/declare with no arguments)"
pattern = '(^|[;&|(`]\s*)(set|export(\s+-p)?|declare(\s+-[xp])?|typeset(\s+-[xp])?|compgen\s+-v|Get-Variable|gv)\s*(\|\s*(sort|cat|head|tail|less|more|tee|uniq|column|base64|pbcopy|xclip|xsel|clip)\b|[;&)`>]|$)'
severity = "block"
message = "BLOCKED: This would read every shell and environment variable, including API keys and tokens, into the agent's conversation, which is sent to the model provider. Check a single, non-secret variable by name instead, or ask the user to approve it with `gorse allow` if you really need the full list."
alternative = "Print one non-secret variable: 'echo \"$PATH\"', or list names only: 'compgen -v | sort'."

[[rules]]
name = "Echo a secret-looking environment variable"
pattern = '\b(echo|printf|print|Write-Host|Write-Output|puts|console\.log|say)\b[^|;&\n]*\$(\{|env:|ENV:)?(?i:[a-z0-9_]*(key|token|secret|passw(or)?d|credentials?|private|auth|pass|apikey|access_key|dsn|database_url|connection_string|passphrase|bearer)(_[a-z0-9_]*)?)\b'
severity = "block"
message = "BLOCKED: This would read a secret environment variable (a key, token, password or credential) into the agent's conversation, which is sent to the model provider. Check whether it is set without printing it, or ask the user to approve it with `gorse allow` if you really need the value."
alternative = "Test presence without revealing the value: '[ -n \"$VAR\" ] && echo set || echo unset', or show only its length: 'echo ${#VAR}'."

[[rules]]
name = "Look up a secret-looking environment variable by name"
pattern = '''\b(printenv|launchctl\s+getenv|getenv|Get-ChildItem\s+env:|gci\s+env:|\$env:|reg\s+query\s[^|;&\n]*\\Environment\s[^|;&\n]*/v)\s*["']?(?i:[a-z0-9_]*(key|token|secret|passw(or)?d|credentials?|private|auth|pass|apikey|access_key|dsn|database_url|connection_string|passphrase|bearer)(_[a-z0-9_]*)?)\b'''
severity = "block"
message = "BLOCKED: This would read a secret environment variable (a key, token, password or credential) into the agent's conversation, which is sent to the model provider. Check whether it is set without printing it, or ask the user to approve it with `gorse allow` if you really need the value."
alternative = "Test presence without revealing the value: '[ -n \"$VAR\" ] && echo set || echo unset'."

[[rules]]
name = "Filter the environment for secret-looking names"
pattern = '\b(env|printenv|set|export|declare\s+-x)\s*\|\s*(grep|egrep|fgrep|rg|ag|ack|awk|sed|findstr|Select-String|sls)\s[^|;&\n]*(?i:key|token|secret|passw|credential|private|auth|apikey|dsn|bearer)'
severity = "block"
message = "BLOCKED: This would search the environment for API keys, tokens or passwords and read the matches into the agent's conversation, which is sent to the model provider. Check a single, non-secret variable by name instead, or ask the user to approve it with `gorse allow` if you really need the values."
alternative = "List matching NAMES only: 'env | cut -d= -f1 | grep -i key'."

[[rules]]
name = "Read a secret-looking environment variable from an interpreter one-liner"
pattern = '''(os\.environ(\.get)?\s*[\[(]\s*["']|os\.getenv\(\s*["']|process\.env(\.|\[\s*["'])|ENV(\.fetch)?\s*[\[(]\s*["']|System\.getenv\(\s*"|os\.Getenv\(\s*"|std::env::var\(\s*"|\$ENV\{\s*["']?|getenv\(\s*["']|Deno\.env\.get\(\s*["']|Bun\.env\.)(?i:[a-z0-9_]*(key|token|secret|passw(or)?d|credentials?|private|auth|pass|apikey|access_key|dsn|database_url|connection_string|passphrase|bearer)(_[a-z0-9_]*)?)\b'''
severity = "block"
message = "BLOCKED: This would read a secret environment variable (a key, token, password or credential) into the agent's conversation, which is sent to the model provider. Check whether it is set without printing it, or ask the user to approve it with `gorse allow` if you really need the value."
alternative = "Test presence without revealing the value, e.g. python3 -c \"import os; print('set' if os.getenv('VAR') else 'unset')\"."

[[rules]]
name = "Dump the whole environment from an interpreter one-liner"
pattern = '''\b(os\.environ|process\.env|ENV\.to_h|ENV\.to_a|System\.getenv\(\)|\$ENV|%ENV|Deno\.env\.toObject\(\)|Bun\.env|Environment\.GetEnvironmentVariables\(\))\s*([)\],;'"]|$)'''
severity = "block"
message = "BLOCKED: This would read every environment variable, including API keys and tokens, into the agent's conversation, which is sent to the model provider. Check a single, non-secret variable by name instead, or ask the user to approve it with `gorse allow` if you really need the full list."
alternative = "Print only the variable names: python3 -c \"import os; print(list(os.environ.keys()))\"."

[[rules]]
name = "Read a process environment from /proc"
pattern = '/proc/(self|thread-self|[0-9]+|\*|\$\$|\$[A-Za-z_]+|\$\{[^}]+\})/environ'
severity = "block"
message = "BLOCKED: This would read a process's environment, including API keys and tokens, into the agent's conversation, which is sent to the model provider. Check a single, non-secret variable by name instead, or ask the user to approve it with `gorse allow` if you really need the full list."
alternative = "Use 'ps -o pid,comm' to inspect processes without reading their environment."

[[rules]]
name = "Dump environment on Windows (PowerShell/cmd)"
pattern = '''((Get-ChildItem|gci|dir|ls|Get-Item|gi)\s+(-Path\s+)?["']?env:[\\/]?\*?["']?\s*($|[;|)>])|Environment\]::GetEnvironmentVariables\(\)|\breg(\.exe)?\s+query\s+"?HK[A-Z_]*\\Environment"?\s*($|[;|)>]))'''
severity = "block"
message = "BLOCKED: This would read every environment variable, including API keys and tokens, into the agent's conversation, which is sent to the model provider. Check a single, non-secret variable by name instead, or ask the user to approve it with `gorse allow` if you really need the full list."
alternative = "Read one non-secret variable: '$env:PATH', or list names only: 'Get-ChildItem env: | Select-Object Name'."

# ─── Bash: CLIs that print live credentials ─────────────────────────────────

[[rules]]
name = "CLI command that prints a live access token or secret"
pattern = '\b(gh\s+auth\s+token|gh\s+auth\s+status\s[^|;&\n]*--show-token|gcloud\s+auth\s+(print-access-token|print-identity-token|print-refresh-token|application-default\s+print-access-token)|aws\s+configure\s+(get\s+aws_secret_access_key|get\s+aws_session_token|export-credentials)|aws\s+sts\s+(get-session-token|assume-role|get-federation-token)|aws\s+secretsmanager\s+get-secret-value|aws\s+ssm\s+get-parameters?\s[^|;&\n]*--with-decryption|az\s+account\s+get-access-token|az\s+keyvault\s+secret\s+show|vault\s+(read|kv\s+get)\s|kubectl\s+get\s+secrets?\s[^|;&\n]*(-o\s*(yaml|json|jsonpath|go-template)|--output)|op\s+(read|item\s+get)\s|doppler\s+secrets(\s+download|\s+get)?\b|heroku\s+config(:get)?\b|fly(ctl)?\s+secrets\s+list\s[^|;&\n]*--json|stripe\s+config\s+--list|npm\s+token\s+(list|create)|docker\s+login\s[^|;&\n]*(-p|--password)\s)'
severity = "block"
message = "BLOCKED: This would print a live access token or secret into the agent's conversation, which is sent to the model provider. Use the CLI to check identity without printing the secret, or ask the user to approve it with `gorse allow` if you really need it."
alternative = "Confirm identity without printing tokens: 'gh auth status', 'gcloud auth list', 'aws sts get-caller-identity', 'kubectl get secret <name>' (names only)."

# ─── Read and Grep tools ────────────────────────────────────────────────────
# The Read tool is given a single file path, so these are anchored on the end
# of the path. Same locations as the Bash rules above. The Grep tool returns
# matching file contents, so the hook routes it through the same "read" rules
# with the path it searches, which may be a directory: the last rule below
# catches a whole credential directory handed to Read or Grep.

[[rules]]
name = "Read tool: cloud or service credential file"
context = "read"
path_pattern = '\.aws[/\\](credentials|config)$|\.kube[/\\]config$|\.config[/\\]gcloud[/\\][^/\\]*credentials[^/\\]*$|\.azure[/\\][^/\\]*[tT]oken[^/\\]*$|\.docker[/\\]config\.json$|\.config[/\\]gh[/\\]hosts\.yml$|\.config[/\\]stripe[/\\]config\.toml$|\.vercel[/\\]auth\.json$|\.config[/\\]supabase[/\\]access-token$|\.terraform\.d[/\\]credentials\.tfrc\.json$|\.git-credentials$|\.gem[/\\]credentials$|\.cargo[/\\]credentials(\.toml)?$|\.m2[/\\]settings\.xml$|(^|[/\\])\.boto$|(^|[/\\])\.s3cfg$|\.config[/\\]hub$'
severity = "block"
message = "BLOCKED: This would read cloud or service credentials (AWS, Kubernetes, Google Cloud, Azure, Docker, GitHub, Stripe or similar) into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Use the provider's CLI to check identity without printing secrets (for example 'aws sts get-caller-identity')."

[[rules]]
name = "Read tool: SSH, GPG or other private key"
context = "read"
path_pattern = '\.ssh[/\\]id_[A-Za-z0-9_-]+$|\.(pem|key|p12|pfx|keystore|jks|ppk)$|(^|[/\\])\.gnupg[/\\]'
severity = "block"
message = "BLOCKED: This would read a private key (SSH, GPG, TLS or a keystore) into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Read the public half instead (for example ~/.ssh/id_ed25519.pub)."

[[rules]]
name = "Read tool: package registry, database or network credential file"
context = "read"
path_pattern = '(^|[/\\])(\.npmrc|\.pypirc|\.netrc|_netrc|\.yarnrc\.yml|\.pgpass|\.my\.cnf|\.psql_history|\.mysql_history)$'
severity = "block"
message = "BLOCKED: This would read a registry, database or network credential file (.npmrc, .pypirc, .netrc, .pgpass or similar) into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Check login state without printing tokens: 'npm whoami'."

[[rules]]
name = "Read tool: .env file"
context = "read"
path_pattern = '(^|[/\\])\.env(\.(local|production|prod|staging|stage|development|dev|test|testing|secret|secrets|ci|preview|live|docker|compose|[0-9]+))?$|(^|[/\\])\.envrc$|(^|[/\\])\.secrets?$'
severity = "block"
message = "BLOCKED: This would read a .env file into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Read .env.example instead, or list the variable names with 'sed -E \"s/=.*//\" .env'."

[[rules]]
name = "Read tool: cryptocurrency wallet or keystore"
context = "read"
path_pattern = '(^|[/\\])wallet\.dat$|\.config[/\\]solana[/\\]id\.json$|(^|[/\\])keystore[/\\]|\.ethereum[/\\]keystore|\.bitcoin[/\\]wallet|\.electrum[/\\]wallets|(^|[/\\])UTC--[0-9]{4}-'
severity = "block"
message = "BLOCKED: This would read a cryptocurrency wallet or keystore into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Use the wallet CLI to show the public address only."

[[rules]]
name = "Read tool: macOS Keychain or Linux keyring files"
context = "read"
path_pattern = 'Library[/\\]Keychains[/\\]|\.local[/\\]share[/\\]keyrings[/\\]|\.gnome2[/\\]keyrings|\.config[/\\]kwalletrc$|\.kde[/\\]share[/\\]apps[/\\]kwallet'
severity = "block"
message = "BLOCKED: This would read the system credential store (macOS Keychain or Linux keyring files) into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Use 'security list-keychains' to see which keychains exist without reading them."

[[rules]]
name = "Read tool: Gorse's own state or a process environment"
context = "read"
path_pattern = '(\.hedgehog|(?i:(appdata[/\\]+roaming|%appdata%|\$\{?env:appdata\}?|\broaming)[/\\]+hedgehog))[/\\](approvals\.json|bypass_codes\.json|exceptions\.log|history\.db|license\.key|logs([/\\]|$))|^/proc/[^/]+/environ$'
severity = "block"
message = "BLOCKED: This would read Gorse's own pending approvals, audit log, history or license, or a process environment, into the agent's conversation, which is sent to the model provider. Reference the file by path instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "Use 'gorse history' or 'gorse status' for a summary that omits approvals and secrets."

[[rules]]
name = "Read tool: whole credential directory"
context = "read"
path_pattern = '(^|[/\\])(\.aws|\.ssh|\.gnupg|\.kube|\.azure|\.docker|\.hedgehog|\.claude)[/\\]?$|\.config[/\\]gcloud[/\\]?$|(?i:(appdata[/\\]+roaming|%appdata%|\$\{?env:appdata\}?|\broaming)[/\\]+hedgehog)[/\\]?$'
severity = "block"
message = "BLOCKED: This would read or search every file in a credential directory (SSH, AWS, GPG, Kubernetes, Google Cloud or Gorse's own state) into the agent's conversation, which is sent to the model provider. Name a single non-secret file instead, or ask the user to approve it with `gorse allow` if you really need the contents."
alternative = "List the directory without reading the files ('ls -la ~/.ssh'), or search a project directory instead."
