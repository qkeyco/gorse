# Gorse Security Pack: Secrets Exfiltration
# Detects credential/secret exfiltration attempts.
# Gorse-unique patterns — not covered by DCG.

[pack]
name = "secrets_exfiltration"
version = "1.0.0"
description = "Detects secret/credential exfiltration attempts"
author = "Gorse"
category = "secrets"

[[rules]]
name = "curl/wget uploading secret files"
pattern = '(curl|wget|http)\s.*(-F\s+|-d\s*@|--data.*@|--upload-file\s+|-T\s+).*(\.env|id_rsa|id_ed25519|id_ecdsa|id_dsa|credentials|\.pem|\.key|\.secret|wallet\.dat|\.p12|\.pfx|\.keystore|\.jks|\.kube/config|\.npmrc|\.netrc|\.pypirc|\.gnupg|hosts\.yml|\.docker/config\.json|\.hedgehog)'
severity = "block"
message = "BLOCKED: This would upload a secret/credential file to a remote server."
alternative = "Copy only the specific non-secret data you need, not the entire credential file."

[[rules]]
name = "cat secrets piped to curl"
pattern = 'cat\s.*(\.env|id_rsa|id_ed25519|credentials|\.pem|\.key)\s*\|.*curl'
severity = "block"
message = "BLOCKED: This would pipe secret file contents to a remote server."
alternative = "Extract only the non-sensitive fields you need from the file."

[[rules]]
name = "base64 encode secrets"
pattern = '(base64|openssl\s+enc).*(\.(env|pem|key)|id_rsa|id_ed25519|credentials).*\|.*(curl|wget|http|nc\s)'
severity = "block"
message = "BLOCKED: This would encode and exfiltrate secret files."
alternative = "Never send encoded secrets over the network. Use a secrets manager instead."

[[rules]]
name = "Clipboard to network"
pattern = 'pbpaste\s*\|.*(curl|wget|http|nc\s|netcat)'
severity = "block"
message = "BLOCKED: This would send clipboard contents to a remote server."
alternative = "Inspect clipboard contents with 'pbpaste' first, then send only safe data."

[[rules]]
name = "env/printenv piped to network"
pattern = '(env|printenv|set)\s*\|.*(curl|wget|http|nc\s|netcat)'
severity = "block"
message = "BLOCKED: This would send all environment variables to a remote server."
alternative = "Send only specific variables: 'echo $VARIABLE | curl ...' (after confirming it's safe)."

[[rules]]
name = "echo secrets to network"
pattern = 'echo\s+.*\$(STRIPE_|AWS_SECRET|OPENAI_API|DATABASE_URL|PRIVATE_KEY|SECRET_KEY).*\|.*(curl|wget|nc\s)'
severity = "block"
message = "BLOCKED: This would send secret environment variables to a remote server."
alternative = "Use a secrets manager (Vault, AWS Secrets Manager) instead of piping secrets."

[[rules]]
name = "Keychain dump"
pattern = 'security\s+(dump-keychain|find-generic-password|find-internet-password)'
severity = "block"
message = "BLOCKED: This would extract passwords from macOS Keychain."
alternative = "Access specific credentials through your app's Keychain API, not via CLI dump."

[[rules]]
name = "SSH key copy to remote"
pattern = '(scp|rsync)\s.*(id_rsa|id_ed25519|id_ecdsa|id_dsa|\.pem|\.key|\.ssh/?|\.aws/?|\.gnupg/?|\.kube/?|\.env\b|credentials|wallet\.dat)\s+.*@'
severity = "block"
message = "BLOCKED: This would copy private keys to a remote server."
alternative = "Use 'ssh-copy-id' to install your public key, or use SSH agent forwarding."

[[rules]]
name = "DNS exfiltration pattern"
pattern = '(dig|nslookup|host)\s+.*\$\('
severity = "block"
message = "BLOCKED: This looks like DNS-based data exfiltration."
alternative = "Use standard DNS lookups without embedding command substitutions."

[[rules]]
name = "Archive or encode a credential directory and pipe it to the network"
pattern = '\b(tar|zip|gzip|bzip2|xz|7z|base64|xxd|cat|cpio|dd)\s[^|\n]*(\.ssh\b|\.aws\b|\.gnupg\b|\.kube\b|\.hedgehog\b|\.env\b|credentials|id_rsa|id_ed25519|id_ecdsa|wallet\.dat|\.pem\b|\.key\b)[^|\n]*\|\s*(curl|wget|nc|ncat|netcat|socat|ssh|openssl\s+s_client|telnet)\b'
severity = "block"
message = "BLOCKED: This would bundle a credential directory or key file and stream it to a remote host."
alternative = "Never send keys or credential directories over the network. Use a secrets manager instead."

[[rules]]
name = "Publish a credential file as a gist or paste"
pattern = '\b(gh\s+gist\s+create|glab\s+snippet\s+create|pastebinit|ix\.io|termbin|transfer\.sh|0x0\.st|file\.io|paste\.rs|sprunge)\b[^|;&\n]*(\.env\b|\.aws[/\\]|\.ssh[/\\]|\.kube[/\\]|\.gnupg[/\\]|\.npmrc|\.netrc|\.pypirc|credentials|id_rsa|id_ed25519|id_ecdsa|\.pem\b|\.key\b|wallet\.dat|\.hedgehog[/\\])'
severity = "block"
message = "BLOCKED: This would publish a credential file to a gist or paste site, where it is public the moment it uploads."
alternative = "Share only non-secret files; redact credentials before posting anything."

[[rules]]
name = "Serve a credential directory or the home directory over HTTP"
pattern = '''\b(python[0-9.]*\s+-m\s+(http\.server|SimpleHTTPServer|pyftpdlib)|npx\s+(serve|http-server|sirv)|php\s+-S|ruby\s+-run\s+-e\s+httpd|caddy\s+file-server|miniserve|busybox\s+httpd|darkhttpd)\b[^|;&\n]*(\.ssh\b|\.aws\b|\.gnupg\b|\.kube\b|\.hedgehog\b|\.config\b|(--directory|-d|--root)\s+["']?(~|\$HOME|\$\{HOME\}|/Users/[^/\s"']+|/home/[^/\s"']+)/?["']?\s*($|[;&|]))'''
severity = "block"
message = "BLOCKED: This would serve a credential directory (or your whole home directory) over HTTP to anyone who can reach this machine."
alternative = "Serve only the project's build output directory, for example 'python3 -m http.server --directory ./dist'."
